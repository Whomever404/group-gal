</div>

<script>
  // 应用启动成功时会把 #app 的内容整个换掉（mountShell 会生成 #title）。
  // 所以这里只需延时看一眼：若 #title 始终没出现，说明没启动起来，才显示兜底提示。
  setTimeout(function () {
    var fb = document.getElementById('boot-fallback');
    if (fb && !document.getElementById('title')) fb.hidden = false;
  }, 1200);
</script>
</body>
</html>
